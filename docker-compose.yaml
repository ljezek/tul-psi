services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-prod
      - backend-prod
      - frontend-dev
      - backend-dev
    networks:
      - spc-network

  # --- Production ---
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${PROD_DATABASE_URL}
      - APP_ENV=prod
      - ROOT_PATH=/api
      - API_PREFIX=/api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    networks:
      - spc-network
    restart: always

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=/api/v1
      - VITE_BASE_URL=/projects/
      - VITE_APP_ENV=prod
    networks:
      - spc-network
    restart: always

  # --- Development ---
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DEV_DATABASE_URL}
      - APP_ENV=dev
      - ROOT_PATH=/dev/api
      - API_PREFIX=/dev/api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    networks:
      - spc-network
    restart: always

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_API_URL=/dev/api/v1
      - VITE_BASE_URL=/dev/projects/
      - VITE_APP_ENV=dev
    networks:
      - spc-network
    restart: always

  # --- Observability ---
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - spc-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./otel/prometheus:/etc/prometheus
    networks:
      - spc-network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./otel/grafana:/var/lib/grafana
    networks:
      - spc-network

networks:
  spc-network:
    driver: bridge
