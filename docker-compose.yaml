# Local development stack: PostgreSQL + backend (hot-reload).
#
# This is for LOCAL development on a workstation. The frontend runs separately via
# `npm run dev` (see frontend/README.md); the VM deployment lives under infra/vm/ and the
# e2e stack in docker-compose.e2e.yaml.
#
# Usage:
#   docker compose up -d            # start db + backend
#   docker compose logs -f backend
#   docker compose down             # stop (add -v to wipe the database)
services:
  db:
    image: postgres:17-alpine
    container_name: tul-psi-db
    environment:
      POSTGRES_DB: student_projects
      POSTGRES_ADMIN_USER: tul_psi_admin
      POSTGRES_ADMIN_PASSWORD: tul_psi_admin
      POSTGRES_USER: tul_psi_admin
      POSTGRES_PASSWORD: tul_psi_admin
      POSTGRES_APP_USER: tul_psi_app
      POSTGRES_APP_PASSWORD: tul_psi_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tul_psi_admin -d student_projects"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: tul-psi-backend
    volumes:
      - ./backend:/app # Bind mount for --reload
    environment:
      - APP_ENV=local
      - DATABASE_MIGRATION_URL=postgresql+asyncpg://tul_psi_admin:tul_psi_admin@db:5432/student_projects
      - DATABASE_URL=postgresql+asyncpg://tul_psi_app:tul_psi_app@db:5432/student_projects
      - LOG_LEVEL=debug
      # Vite dev server origins so CORS allows credentialed requests (session cookie).
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # No OpenTelemetry collector locally.
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
