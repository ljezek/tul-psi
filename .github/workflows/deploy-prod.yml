name: Deploy Production
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/spc/prod
            # Note: The VM setup doc instructions said to have spc/prod
            # We assume the repo is cloned in ~/spc/repo and we use it to deploy
            # Or better: just use the home directory and one repo clone
            cd ~/spc
            git pull origin main
            
            # Build and restart production services
            docker compose build backend-prod frontend-prod
            docker compose up -d backend-prod frontend-prod nginx jaeger prometheus grafana
            
            # Run database migrations
            docker compose exec -T backend-prod alembic upgrade head
