name: "Deploy to VM (Dev)"

# On push to main: build SHA-tagged GHCR images and auto-deploy the DEV stack on the VM.
# Prod is a separate, manual promotion of the same SHA (see promote-to-prod.yml).
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/vm/spc/**'
      - 'infra/vm/spc-dev/**'
      - 'infra/vm/edge/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  # GHCR image namespace (lowercase owner/repo).
  IMAGE_BASE: ghcr.io/ljezek/tul-psi

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version string
        id: ver
        run: echo "version=0.1.0-b${{ github.run_number }}+$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # All three images are built on every push so that ANY main SHA is promotable to
      # prod — the prod frontend image must already exist when promote-to-prod runs.
      - name: Build & push backend (shared by prod, dev, and both migrate runners)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BASE }}/backend:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend (dev variant)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}-dev
          build-args: |
            VITE_BASE_URL=/dev/projects/
            VITE_API_URL=/dev
            VITE_APP_ENV=dev
            VITE_XSRF_COOKIE_NAME=XSRF-TOKEN-dev
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,scope=frontend-dev,mode=max

      - name: Build & push frontend (prod variant)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}-prod
          build-args: |
            VITE_BASE_URL=/projects/
            VITE_API_URL=
            VITE_APP_ENV=prod
            VITE_XSRF_COOKIE_NAME=XSRF-TOKEN
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,scope=frontend-prod,mode=max

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Deploy dev stack over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          # Pull uses the ephemeral GITHUB_TOKEN — no long-lived PAT on the box.
          envs: GHCR_TOKEN,GITHUB_ACTOR,IMAGE_TAG,REPO_PATH
          script: |
            set -euo pipefail
            cd "$REPO_PATH"
            git fetch origin --prune
            git checkout -f "$IMAGE_TAG"     # exact tree for this SHA; .env/provision.conf are gitignored and survive
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd infra/vm/spc-dev
            IMAGE_TAG="$IMAGE_TAG" docker compose pull
            IMAGE_TAG="$IMAGE_TAG" docker compose --profile migrate run --rm spc-migrate-dev
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d
            docker compose ps
            cd ../edge && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker logout ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          REPO_PATH: ${{ secrets.VM_REPO_PATH }}
