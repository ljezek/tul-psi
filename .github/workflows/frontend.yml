name: Frontend Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'frontend/**'
    branches: [ main ]

jobs:
  test-and-lint-frontend:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write # Required for posting the preview link comment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Run Unit Tests with Coverage
        run: |
          npm test -- --coverage.enabled true --coverage.reporter text | tee coverage.txt
          echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
